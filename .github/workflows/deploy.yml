name: CI / Deploy

# Every push to main: checks → build images → push to GHCR → deploy to the VPS over SSH.
# Pull requests only run the checks.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: referral-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: referral, POSTGRES_USER: referral, POSTGRES_PASSWORD: referral }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U referral" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://referral:referral@localhost:5432/referral
      DJANGO_SECRET_KEY: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements.txt }
      - name: Backend checks
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test referrals
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Frontend typecheck
        working-directory: frontend
        run: npm ci && npx tsc --noEmit

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      backend_image: ${{ steps.meta.outputs.backend }}
      frontend_image: ${{ steps.meta.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          sha="${GITHUB_SHA::12}"
          echo "prefix=ghcr.io/${owner}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "backend=ghcr.io/${owner}/referral-backend:${sha}" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${owner}/referral-frontend:${sha}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/referral-backend:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.prefix }}/referral-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: BACKEND_URL=http://backend:8000
          tags: |
            ${{ steps.meta.outputs.prefix }}/referral-frontend:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.prefix }}/referral-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Check server secrets
        id: cfg
        env: { SSH_HOST: "${{ secrets.SSH_HOST }}" }
        run: echo "ready=$([ -n "$SSH_HOST" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Copy deploy files to the server
        if: steps.cfg.outputs.ready == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy/docker-compose.yml,deploy/deploy.sh,deploy/.env.example"
          target: /home/deploy/referral
      - name: Deploy
        if: steps.cfg.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /home/deploy/referral/deploy
            chmod +x deploy.sh
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin
            fi
            BACKEND_IMAGE=${{ needs.build.outputs.backend_image }} \
            FRONTEND_IMAGE=${{ needs.build.outputs.frontend_image }} \
              ./deploy.sh
